name: Differential corpus

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

# Seeded differential corpus as a regression gate. The seed and the count are
# fixed, the corpus digest is verified before any engine starts, and every
# observed difference must match one entry in the known-difference baseline.
jobs:
  corpus:
    name: differential corpus
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PostgreSQL test dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build the TypeScript packages
        run: pnpm run build:ts
      - name: Build the native binding
        run: node scripts/build-napi.mjs
      - name: Differential corpus gate
        run: pnpm corpus -- --seed 20261106 --count 118 --check
