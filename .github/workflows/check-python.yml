name: Check Python

# Wheel build plus a clean virtual environment import. The merged harness in
# check-typescript.yml also covers the Python suite end to end.
# Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: postgres-pyo3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/postgres.rs
      - name: Install the wheel build tool
        run: python -m pip install --quiet "maturin>=1.7,<2.0"
      - name: Build the wheel and import it in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          dist="$root/dist"
          venv="$root/venv"
          mkdir -p "$dist"
          python -m maturin build --manifest-path projects/postgres.rs/postgres-pyo3/Cargo.toml --out "$dist"
          python -m venv "$venv"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            py="$venv/Scripts/python.exe"
            pip="$venv/Scripts/pip.exe"
          else
            py="$venv/bin/python"
            pip="$venv/bin/pip"
          fi
          "$pip" install --upgrade pip
          wheel="$(ls "$dist"/*.whl | head -n 1)"
          "$pip" install --no-input --disable-pip-version-check "$wheel"
          "$py" -c "import postgres_pyo3; print(postgres_pyo3.__name__)"
