name: Check Rust

# Rust workspace fmt / build / test. TypeScript: check-typescript.yml
# Python: check-python.yml. Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: rustc --version && cargo --version
      - name: Format check
        run: cargo fmt --manifest-path projects/postgres.rs/Cargo.toml --all --check

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/postgres.rs
      - name: Build
        run: cargo build --release --manifest-path projects/postgres.rs/Cargo.toml --workspace
      - name: Tests
        run: cargo test --release --manifest-path projects/postgres.rs/Cargo.toml -p postgres-napi -p postgres-pyo3 -- --test-threads=1

  rust-test-live:
    name: cargo test (live PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/postgres.rs
      - name: Tests
        env:
          POSTGRES_TEST_PORT: 5432
        run: cargo test --release --manifest-path projects/postgres.rs/Cargo.toml -p postgres-napi -p postgres-pyo3 -- --test-threads=1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/postgres.rs
      - name: Clippy
        run: cargo clippy --release --manifest-path projects/postgres.rs/Cargo.toml --workspace --all-targets -- -D warnings
  toolchain-health:
    name: toolchain health
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustup show active-toolchain && rustc -vV
