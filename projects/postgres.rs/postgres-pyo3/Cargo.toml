[package]
name = "postgres-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for the PostgreSQL protocol-v3 primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib"]
name = "postgres_pyo3"

[dependencies]
pyo3 = { workspace = true }
database-client = { git = "https://github.com/oovm/boost.rs.git", rev = "9d40653b21e3bb8130f032e15cb56960b11071b4" }
database-protocol-pgsql = { git = "https://github.com/oovm/boost.rs.git", rev = "9d40653b21e3bb8130f032e15cb56960b11071b4" }
database-storage = { git = "https://github.com/oovm/boost.rs.git", rev = "9d40653b21e3bb8130f032e15cb56960b11071b4" }
postgres = { git = "https://github.com/oovm/boost.rs.git", rev = "9d40653b21e3bb8130f032e15cb56960b11071b4" }

[build-dependencies]
pyo3-build-config = "0.30.1"
