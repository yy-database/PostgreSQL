[package]
name = "postgres-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for the PostgreSQL protocol-v3 primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib"]
name = "postgres_pyo3"

[dependencies]
pyo3 = { workspace = true }
database-client = { git = "https://github.com/oovm/database.rs.git", rev = "13ae964bdd1026517d7d9c7cb37a7bc811299a2e" }
database-protocol-pgsql = { git = "https://github.com/oovm/database.rs.git", rev = "13ae964bdd1026517d7d9c7cb37a7bc811299a2e" }

[build-dependencies]
pyo3-build-config = "0.30.1"
