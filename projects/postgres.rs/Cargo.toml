[workspace]
resolver = "2"
members = [
    "postgres-napi",
    "postgres-pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/PostgreSQL"

[workspace.dependencies]
napi = { version = "3.14.2", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
