[package]
name = "postgres-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for the PostgreSQL protocol-v3 primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib"]
name = "postgres_napi"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
database-client = { git = "https://github.com/oovm/boost.rs.git", rev = "3de78d5a9e9eb19a0d68db466a3d33b374835ddc" }
database-protocol-pgsql = { git = "https://github.com/oovm/boost.rs.git", rev = "3de78d5a9e9eb19a0d68db466a3d33b374835ddc" }
database-storage = { git = "https://github.com/oovm/boost.rs.git", rev = "3de78d5a9e9eb19a0d68db466a3d33b374835ddc" }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "3de78d5a9e9eb19a0d68db466a3d33b374835ddc", default-features = false, features = ["harness"] }
postgres = { git = "https://github.com/oovm/boost.rs.git", rev = "3de78d5a9e9eb19a0d68db466a3d33b374835ddc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.napi]
name = "postgres"
