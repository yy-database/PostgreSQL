[package]
name = "postgres-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for the PostgreSQL protocol-v3 primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib"]
name = "postgres_napi"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
database-client = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7" }
database-protocol-pgsql = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7" }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7", default-features = false, features = ["harness"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.napi]
name = "postgres"
