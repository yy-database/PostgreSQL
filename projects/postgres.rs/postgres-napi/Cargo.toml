[package]
name = "postgres-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API bindings for the PostgreSQL protocol-v3 primitives"
readme = "readme.md"
publish = false

[lib]
crate-type = ["cdylib"]
name = "postgres_napi"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
database-client = { git = "https://github.com/oovm/database.rs.git", rev = "13ae964bdd1026517d7d9c7cb37a7bc811299a2e" }
database-protocol-pgsql = { git = "https://github.com/oovm/database.rs.git", rev = "13ae964bdd1026517d7d9c7cb37a7bc811299a2e" }

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.napi]
name = "postgres"
